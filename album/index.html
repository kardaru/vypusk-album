<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#06080b">
<meta name="build" content="c34c05b591">
<meta name="robots" content="noindex, nofollow">
<title>Ноябрьское</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="img/icon-192.png">
<link rel="apple-touch-icon" href="img/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ноябрьское">
<link rel="stylesheet" href="styles.c34c05b591.css">
</head>
<body>
<div class="bg grid" aria-hidden="true"></div>
<div class="bg vignette" aria-hidden="true"></div>
<div class="bg grain" aria-hidden="true"></div>
<div class="bg scan" aria-hidden="true"></div>
<div class="hud" aria-hidden="true"></div>

<!-- сам music disk -->
<main id="album" class="album" hidden>
  <header class="masthead">
    <span class="wordmark" id="mastFile"></span>
    <span class="side-tag" id="sideTag"></span>
  </header>

  <section class="stage">
    <div class="cover-wrap">
      <div class="cover" id="cover">
        <div class="cover-missing" id="coverMissing">&#9834;</div>
      </div>
    </div>

    <div class="band"><canvas id="spectrum" width="600" height="48"></canvas></div>

    <div class="meta">
      <p class="track-no" id="trackNo">0x01</p>
      <h2 class="track-title" id="trackTitle"></h2>
      <p class="track-artist" id="trackArtist"></p>
      <p class="track-note" id="trackNote"></p>
    </div>
  </section>

  <section class="transport">
    <div class="seek-row">
      <span class="t" id="timeNow">0:00</span>
      <div class="seek" id="seek" role="slider" aria-label="Перемотка" tabindex="0">
        <div class="seek-filled" id="seekFilled"></div>
      </div>
      <span class="t" id="timeTotal">0:00</span>
    </div>
    <div class="controls">
      <button class="ctl" id="btnPrev" aria-label="Предыдущий"><svg viewBox="0 0 24 24"><path d="M6 4h2.2v16H6zM20 4.2v15.6L9.2 12z"/></svg></button>
      <button class="ctl main" id="btnPlay" aria-label="Играть"></button>
      <button class="ctl" id="btnNext" aria-label="Следующий"><svg viewBox="0 0 24 24"><path d="M15.8 4H18v16h-2.2zM4 4.2 14.8 12 4 19.8z"/></svg></button>
      <button class="ctl ghost" id="btnList">СПИСОК</button>
      <button class="ctl ghost" id="btnCredits">ТИТРЫ</button>
    </div>
  </section>

  <nav class="rail" id="rail" aria-label="Список треков"></nav>

  <footer class="foot">
    <span id="offlineBadge" class="badge" hidden>офлайн</span>
    <span class="hint">space &middot; &larr;&rarr; &middot; 1&ndash;9 &middot; титры &mdash; c</span>
    <span id="buildTag" class="ver"></span>
  </footer>
</main>

<section id="credits" class="credits" hidden>
  <div class="credits-scroll" id="creditsScroll"></div>
  <button class="credits-close" id="creditsClose">[ закрыть титры ]</button>
</section>

<audio id="audio" preload="metadata"></audio>
<script type="module" src="app.c34c05b591.js"></script>
</body>
</html>
